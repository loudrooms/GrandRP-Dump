<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRAND ROLE PLAY</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        @font-face{font-family:akrobat;font-style:normal;font-weight:500;src:local('Akrobat'),url(https://fonts.cdnfonts.com/s/14486/Akrobat-Regular.woff) format('woff')}@font-face{font-family:akrobat light;font-style:normal;font-weight:400;src:local('Akrobat Light'),url(https://fonts.cdnfonts.com/s/14486/Akrobat-Light.woff) format('woff')}@font-face{font-family:akrobat extralight;font-style:normal;font-weight:300;src:local('Akrobat ExtraLight'),url(https://fonts.cdnfonts.com/s/14486/Akrobat-ExtraLight.woff) format('woff')}@font-face{font-family:akrobat semibold;font-style:normal;font-weight:600;src:local('Akrobat SemiBold'),url(https://fonts.cdnfonts.com/s/14486/Akrobat-SemiBold.woff) format('woff')}@font-face{font-family:akrobat bold;font-style:normal;font-weight:700;src:local('Akrobat Bold'),url(https://fonts.cdnfonts.com/s/14486/Akrobat-Bold.woff) format('woff')}@font-face{font-family:akrobat extrabold;font-style:normal;font-weight:800;src:local('Akrobat ExtraBold'),url(https://fonts.cdnfonts.com/s/14486/akrobat-extrabold-webfont.woff) format('woff')}@font-face{font-family:akrobat black;font-style:normal;font-weight:900;src:local('Akrobat Black'),url(https://fonts.cdnfonts.com/s/14486/Akrobat-Black.woff) format('woff')}


        :root {
            --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
            --transition-duration: 1.1s;
            --bg-dark: #0a0a0b;
        }

        html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--bg-dark);
        }

        body {
            margin: auto;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 50px 64px 40px;
            width: 1920px;
            height: 100%;
            overflow: hidden;
            color: #F1F1F1;
            font-family: Akrobat;
            background: var(--bg-dark);
        }

        .slides {
            position: fixed;
            inset: -10px;
            z-index: 0;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            visibility: hidden;
            overflow: hidden;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
            z-index: 2;
            transition: opacity 0.9s ease-in;
        }

        .slide.leaving {
            opacity: 0;
            z-index: 1;
            transition: opacity var(--transition-duration) ease-out;
        }

        .crossfade-veil {
            position: fixed;
            inset: 0;
            z-index: 3;
            background: var(--bg-dark);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s ease-in-out;
        }

        .crossfade-veil.visible {
            opacity: 0.42;
        }

        .slide__inner {
            position: absolute;
            inset: -15%;
            pointer-events: none;
        }

        .slide__inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        header,
        .logo,
        .loader {
            position: relative;
            z-index: 10;
        }

        header {
            align-self: stretch;
            display: flex;
            align-items: center;
            gap: 44px;
            animation: fadeSlideDown 2s var(--ease-smooth) 0.5s both;
        }

        @keyframes fadeSlideDown {
            from {
                opacity: 0;
                transform: translateY(-24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header h6 {
            color: #F1F1F1;
            font-size: 14px;
            font-style: normal;
            font-weight: 700;
            line-height: 14px;
            letter-spacing: 6.16px;
            text-transform: uppercase;
        }

        header .divider {
            flex: 1;
            height: 1px;
            opacity: 0.4;
            background: #F1F1F1;
            transform-origin: left;
            animation: dividerGrow 2s var(--ease-smooth) 0.8s both;
        }

        @keyframes dividerGrow {
            from { transform: scaleX(0); opacity: 0; }
            to { transform: scaleX(1); opacity: 0.4; }
        }

        header .buttons {
            display: flex;
            gap: 32px;
            align-items: center;
        }

        header .buttons button {
            height: 53px;
            width: 160px;
            outline: none;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.5s var(--ease-smooth), filter 0.5s ease;
        }

        header .buttons button:hover {
            transform: scale(1.02);
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.2));
        }

        header .buttons button:active {
            transform: scale(0.98);
        }

        .logo {
            width: 186px;
            height: 186px;
            animation:
                fadeScaleIn 2s var(--ease-smooth) 0.7s both,
                logoBreathe 6s ease-in-out 3s infinite;
        }

        @keyframes fadeScaleIn {
            from {
                opacity: 0;
                transform: scale(0.85);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes logoBreathe {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.015);
            }
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loader {
            display: flex;
            width: 626px;
            min-height: 20px;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.20);
            background: linear-gradient(180deg, rgba(21, 22, 23, 0.70) 0%, rgba(21, 22, 23, 0.31) 100%);
            animation: fadeSlideUp 2s var(--ease-smooth) 1s both;
        }

        .loader span {
            display: block;
            width: 0%;
            height: 6px;
            border-radius: 2px;
            background: #F1F1F1;
            box-shadow: 0 -4px 10px 0 rgba(0, 0, 0, 0.60), 0 4px 12px 0 #FFF, 0 4px 24px 0 #FFF, 0 4px 40px 0 #FFF;
            transition: width 0.8s var(--ease-smooth);
        }

        .particles {
            position: fixed;
            inset: 0;
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>

                const transform = getComputedStyle(inner).transform;
                if (activeKenBurns) {
                    activeKenBurns.cancel();
                    activeKenBurns = null;
                }
                if (transform && transform !== "none") {
                    inner.style.transform = transform;
                }
            }

            function startKenBurns(inner) {
                inner.style.transform = "";
                const { tx, ty, scale } = randomKenBurns();

                activeKenBurns = inner.animate(
                    [
                        { transform: "scale(1) translate(0, 0)" },
                        { transform: `scale(${scale}) translate(${tx}%, ${ty}%)` },
                    ],
                    {
                        duration: SLIDE_INTERVAL,
                        easing: "ease-in-out",
                        fill: "forwards",
                    }
                );

                return activeKenBurns;
            }

            function goToSlide(nextIndex) {
                if (isTransitioning || nextIndex === currentSlide) return;
                isTransitioning = true;

                const current = slides[currentSlide];
                const next = slides[nextIndex];
                const currentInner = current.querySelector(".slide__inner");
                const nextInner = next.querySelector(".slide__inner");

                freezeTransform(currentInner);

                crossfadeVeil.classList.add("visible");

                next.style.visibility = "visible";
                next.classList.add("active");
                current.classList.remove("active");
                current.classList.add("leaving");

                startKenBurns(nextInner);

                setTimeout(() => crossfadeVeil.classList.remove("visible"), TRANSITION_MS * 0.55);

                setTimeout(() => {
                    current.classList.remove("leaving");
                    current.style.visibility = "hidden";
                    currentInner.style.transform = "";
                    currentSlide = nextIndex;
                    isTransitioning = false;
                }, TRANSITION_MS);
            }

            function randomSlideIndex(exclude) {
                if (slides.length <= 1) return 0;
                let index;
                do {
                    index = Math.floor(Math.random() * slides.length);
                } while (index === exclude);
                return index;
            }

            function initSlides() {
                const startIndex = Math.floor(Math.random() * slides.length);
                slides.forEach((slide, i) => {
                    const isActive = i === startIndex;
                    slide.classList.toggle("active", isActive);
                    slide.style.visibility = isActive ? "visible" : "hidden";
                });
                currentSlide = startIndex;
                startKenBurns(slides[startIndex].querySelector(".slide__inner"));
            }

            function nextSlide() {
                goToSlide(randomSlideIndex(currentSlide));
            }

            initSlides();
            setInterval(nextSlide, SLIDE_INTERVAL);

            let parallaxX = 0;
            let parallaxY = 0;
            let targetX = 0;
            let targetY = 0;

            document.addEventListener("mousemove", (e) => {
                const cx = (e.clientX / window.innerWidth - 0.5) * 2;
                const cy = (e.clientY / window.innerHeight - 0.5) * 2;
                targetX = cx * 5;
                targetY = cy * 3;
            });

            function animateParallax() {
                parallaxX += (targetX - parallaxX) * 0.03;
                parallaxY += (targetY - parallaxY) * 0.03;

                if (slidesEl) {
                    slidesEl.style.transform = `translate(${parallaxX}px, ${parallaxY}px)`;
                }

                requestAnimationFrame(animateParallax);
            }

            animateParallax();

            // Particles
            const canvas = document.getElementById("particles");
            const ctx = canvas.getContext("2d");
            let particles = [];

            function resizeParticles() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            function createParticles() {
                particles = Array.from({ length: 36 }, () => ({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: 0.6 + Math.random() * 1.4,
                    speed: 0.08 + Math.random() * 0.18,
                    drift: (Math.random() - 0.5) * 0.12,
                    alpha: 0.08 + Math.random() * 0.18,
                }));
            }

            function drawParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (const p of particles) {
                    p.y -= p.speed;
                    p.x += p.drift;
                    if (p.y < -4) {
                        p.y = canvas.height + 4;
                        p.x = Math.random() * canvas.width;
                    }
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                    ctx.fill();
                }
                requestAnimationFrame(drawParticles);
            }

            resizeParticles();
            createParticles();
            drawParticles();

            handleResize();
            window.addEventListener("resize", () => {
                handleResize();
                resizeParticles();
                createParticles();
            });

            const bgAudio = document.getElementById("bg-audio");
            const MUSIC_VOLUME = 0.1;

            function startMusic() {
                if (!bgAudio || !bgAudio.paused) return;
                bgAudio.volume = MUSIC_VOLUME;
                bgAudio.play().catch(() => {});
            }

            if (bgAudio) {
                bgAudio.volume = MUSIC_VOLUME;
                startMusic();
                bgAudio.addEventListener("canplay", startMusic);
                window.addEventListener("load", startMusic);
                document.addEventListener("visibilitychange", () => {
                    if (!document.hidden) startMusic();
                });               

                let musicRetries = 0;
                const musicRetryTimer = setInterval(() => {
                    startMusic();
                    if (!bgAudio.paused || ++musicRetries >= 20) clearInterval(musicRetryTimer);
                }, 500);
            }

            window.addEventListener("message", (event) => {
                if (event.data.eventName !== "loadProgress") return;
                const fraction = Math.min(Math.max(event.data.loadFraction ?? 0, 0), 1);
                setProgress(Math.round(fraction * 100));
            });

            // Для тестов
            // const isFiveM = typeof window.GetParentResourceName === "function";

            // if (!isFiveM) {
            //     let demo = 0;
            //     const demoInterval = setInterval(() => {
            //         demo = Math.min(demo + 0.8 + Math.random() * 1.2, 100);
            //         setProgress(demo);
            //         if (demo >= 100) clearInterval(demoInterval);
            //     }, 350);
            // }
        })();
    </script>
