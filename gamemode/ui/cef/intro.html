    .auth_intro {
        position: fixed;
        inset: 0;
        width: 100%;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #151617;
        background-image:
            radial-gradient(ellipse 120% 80% at 28% 75%, rgba(255, 255, 255, 0.04) 0%, transparent 55%),
            radial-gradient(ellipse 100% 70% at 72% 25%, rgba(255, 255, 255, 0.03) 0%, transparent 50%);
        transition: opacity 1s ease;
    }
    .auth_intro-info { width: 724px; max-width: calc(100vw - 48px); }
    .auth_intro-text {
        color: rgba(255, 255, 255, 0.7);
        font-family: Akrobat, sans-serif;
        font-size: 20px;
        line-height: 140%;
        letter-spacing: 0.4px;
        margin-top: 46px;
	user-select: none;
    }
    .progress-bar {
        margin-top: 46px;
        width: 100%;
        height: 6px;
        border-radius: 12px;
        overflow: hidden;
        background-color: rgba(0, 0, 0, 0.6);
    }
    .progress {
        width: 0%;
        height: inherit;
        border-radius: 12px;
        background: #FFDE2A;
        animation: filling-progress 8s forwards;
    }
    @keyframes filling-progress {
        from { width: 0%; }
        to { width: 100%; }
    }
